name: Verify NextRole

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Install locked dependencies
        run: |
          corepack enable
          corepack pnpm install --frozen-lockfile
      - name: Check types
        run: corepack pnpm typecheck
      - name: Verify isolated workflows and scale boundaries
        run: corepack pnpm test:scale
      - name: Audit runtime dependencies
        run: corepack pnpm audit --prod --audit-level=high
      - name: Prepare the Vercel frontend
        run: |
          node scripts/prepare-vercel.mjs --out "$RUNNER_TEMP/nextrole-vercel" --render-backend
          node scripts/prepare-render.mjs --out "$RUNNER_TEMP/nextrole-render"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/nextrole-vercel/node_modules"
          ln -s "$GITHUB_WORKSPACE/node_modules" "$RUNNER_TEMP/nextrole-render/node_modules"
      - name: Verify Render and frontend identity boundaries
        run: node --experimental-strip-types scripts/verify-render.mjs "$RUNNER_TEMP/nextrole-render" "$RUNNER_TEMP/nextrole-vercel"
      - name: Verify password authentication and generated backend preparation
        run: |
          node --experimental-strip-types scripts/verify-email-gateway.mjs "$RUNNER_TEMP/nextrole-render"
          node --experimental-strip-types scripts/verify-render-preparation.mjs
      - name: Build the frontend without production credentials
        working-directory: ${{ runner.temp }}/nextrole-vercel
        run: node node_modules/next/dist/bin/next build --webpack
